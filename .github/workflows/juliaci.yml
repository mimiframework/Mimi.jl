name: Julia CI

on:
  push: {branches: [main,master]}
  pull_request: {types: [opened,synchronize,reopened,ready_for_review,converted_to_draft]}
  issue_comment: {types: [created]}
  workflow_dispatch: {inputs: {feature: {type: choice, description: What to run, options: [DocDeploy,LintAndTest,TagBot]}}}

jobs:
  julia-ci:
    uses: julia-testitems/testitem-workflow/.github/workflows/juliaci.yml@v2
    with:
      include-linux-x86: false
      github_job_prep_script: test/github_job_prep.jl
      # JULIA_NUM_THREADS so that the `parallel` test item actually exercises threads,
      # rather than interleaving the worker tasks on a single one
      env: '{"DISPLAY": ":99", "PYTHON": "", "JULIA_NUM_THREADS": "4"}'
    permissions: write-all
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
